[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygramattic-reports"
version = "0.1.0"
description = "Unified Python Report Processing & Generation Tool"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "jinja2>=3.1",
    "typer>=0.9",
    "rich>=13.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "openpyxl>=3.1",
    "python-docx>=1.0",
    "structlog>=23.0",
    "mistune>=3.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "ruff>=0.9",
    "mypy>=1.5",
    "pre-commit>=3.0",
    "pandas-stubs>=2.0",
    "types-pyyaml>=6.0",
    "types-jinja2>=2.11",
    "types-openpyxl>=3.1",
    "bandit>=1.7",
    "vulture>=2.10",
    "safety>=2.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
]
google = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
]
all = [
    "pygramattic-reports[dev,test,google]",
]

[project.scripts]
report = "pygramattic_reports.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pygramattic_reports"]

# =============================================================================
# Ruff - Strictest possible configuration
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Enable the most comprehensive rule set possible
select = [
    "F",        # Pyflakes - core error detection
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "I",        # isort - import sorting
    "N",        # pep8-naming
    "UP",       # pyupgrade - modern Python syntax
    "B",        # flake8-bugbear - common bugs
    "SIM",      # flake8-simplify
    "S",        # flake8-bandit - security
    "A",        # flake8-builtins - builtin shadowing
    "C4",       # flake8-comprehensions
    "DTZ",      # flake8-datetimez - timezone-aware datetimes
    "T10",      # flake8-debugger - no debugger statements
    "EM",       # flake8-errmsg - clean exception messages
    "FA",       # flake8-future-annotations
    "ISC",      # flake8-implicit-str-concat
    "ICN",      # flake8-import-conventions
    "LOG",      # flake8-logging
    "G",        # flake8-logging-format
    "PIE",      # flake8-pie - misc lints
    "PT",       # flake8-pytest-style
    "Q",        # flake8-quotes
    "RSE",      # flake8-raise
    "RET",      # flake8-return
    "SLF",      # flake8-self - no private member access
    "SLOT",     # flake8-slots
    "TID",      # flake8-tidy-imports
    "TCH",      # flake8-type-checking
    "ARG",      # flake8-unused-arguments
    "PTH",      # flake8-use-pathlib
    "PGH",      # pygrep-hooks
    "PL",       # pylint (all: PLC, PLE, PLR, PLW)
    "TRY",      # tryceratops - exception best practices
    "FLY",      # flynt - f-string conversion
    "PERF",     # perflint - performance
    "FURB",     # refurb - modernization
    "RUF",      # Ruff-specific rules
    "D",        # pydocstyle - docstring enforcement
    "ANN",      # flake8-annotations - type annotation enforcement
    "C90",      # mccabe - complexity
    "ERA",      # eradicate - commented-out code
    "T20",      # flake8-print - no print statements in library code
]
ignore = [
    # Docstring rules that conflict with each other or are too noisy for init
    "D100",     # Missing docstring in public module (handled at package level)
    "D104",     # Missing docstring in public package (we have them in __init__.py)
    "D203",     # 1 blank line required before class docstring (conflicts with D211)
    "D213",     # Multi-line docstring summary should start at the second line (conflicts with D212)

    # Overly aggressive for this codebase
    "TRY003",   # Avoid specifying long messages outside the exception class
    "EM101",    # Exception must not use a string literal (too verbose for clear errors)
    "EM102",    # Exception must not use an f-string literal

    # Print is used intentionally in CLI
    "T20",      # Re-enabled per-file below for non-CLI code
]

[tool.ruff.lint.per-file-ignores]
# Tests can use assert, magic values, print, and don't need full annotations
"tests/**/*.py" = [
    "S101",     # Use of assert
    "PLR2004",  # Magic value in comparison
    "ANN",      # Type annotations not required in tests
    "D",        # Docstrings not required in tests
    "ARG",      # Unused arguments common in fixtures
    "SLF001",   # Private member access OK in tests
    "T20",      # Print OK in tests
]
# CLI modules can use print
"src/pygramattic_reports/cli/**/*.py" = [
    "T20",      # Print/typer.echo is expected in CLI
]
# __init__.py files have relaxed docstring rules
"**/__init__.py" = [
    "D104",     # Public package docstring already present
    "F401",     # Unused imports OK in __init__ (re-exports)
]

[tool.ruff.lint.isort]
known-first-party = ["pygramattic_reports"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-returns = 6
max-branches = 12
max-statements = 50

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-none-returning = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "pygramattic_reports.models.base.PygramatticModel",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# =============================================================================
# Mypy - Strict mode with all optional strictness flags
# =============================================================================

[tool.mypy]
python_version = "3.11"
packages = ["pygramattic_reports"]
mypy_path = ["src"]
plugins = ["pydantic.mypy"]

# Strict mode (enables most checks)
strict = true

# Additional strictness beyond --strict
warn_unreachable = true
warn_no_return = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Disallow any untyped code
disallow_any_unimported = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

# Strictness for None handling
no_implicit_optional = true
strict_optional = true

# Import checking
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "docx.*",
    "openpyxl.*",
    "seaborn.*",
    "mistune.*",
    "matplotlib.*",
]
ignore_missing_imports = true

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
]
xfail_strict = true

# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
source = ["pygramattic_reports"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# =============================================================================
# Bandit - Security linting
# =============================================================================

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert is fine in non-test code for invariants

# =============================================================================
# Vulture - Dead code detection
# =============================================================================

[tool.vulture]
min_confidence = 80
paths = ["src/pygramattic_reports"]
exclude = ["tests/"]
